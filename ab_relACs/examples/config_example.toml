[relacs]
slt_filepath = ""
number_cpus = 64

orientations = [[0,0,1,1],[0,1,0,1]]
fields = [0.1] 
temperatures = [20,25]
frequencies = "np.logspace(-1, 6, 7000)"

states_number = 13
degeneracy_tolerance = 1e-12
psi_frequency_shift = true
initial_correlation = true
omega_loop = false
chi_s = false

n_points = [69]
q_ranges = [0.25,0.5]
broadening = "gaussian"
fwhm = [0.02]
adaptive_fwhm = false
modes_low = 1e-8
cutoff_fwhm = 2.07729
direct = true

chi_csv_path = ""
tau_21_csv_path = ""
tau_41_csv_path = ""
show_plot = true

[supercell]
xyz_path = ""
group_name = ""
cell_params = [22.663134149075237, 22.663134149075233, 25.14851428466812, 90.0, 90.0, 120.0]
nx = 3
ny = 3
nz = 2
replace_atoms = [0]
new_atoms = ["Tb"]

[hessian]
path = ""
group_name = ""
displacement_number = 1
step = 0.01
accoustic_sum_rule = "symmetric"
dos = ""

[spin_phonon]
path = ""  
group_name = ""
orca_fragovl_path =  ""
displacement_number = 1
step = 0.0005
